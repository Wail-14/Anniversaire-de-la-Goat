<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>🎁 Surprise</title>

<style>
/* ===== GLOBAL ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e6f0ff, #ffffff);
  overflow: hidden;
}

/* ===== NAVBAR ===== */
.navbar {
  background: white;
  border-bottom: 3px solid #4da3ff;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  color: #2c6fff;
}

/* ===== PAGES ===== */
.page {
  display: none;
  height: calc(100vh - 60px);
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

.active {
  display: flex;
}

/* ===== BUTTONS ===== */
button {
  margin-top: 15px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #2c6fff;
  color: white;
  font-size: 16px;
  transition: 0.2s;
}

button:hover {
  background: #174bcc;
}

/* ===== TITLE ===== */
h1 {
  font-size: 40px;
  color: #2c6fff;
}

/* ===== SMALL TEXT ===== */
p {
  font-size: 18px;
}

/* ===== SELECT ===== */
select {
  padding: 10px;
  font-size: 16px;
  margin-top: 10px;
}

/* ===== FINAL BOX ===== */
.box {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<div class="navbar">💙 Surprise d'anniversaire 💙</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
  <h1>Joyeux Anniversaire 🎉</h1>
  <p>J’ai préparé quelque chose pour toi…</p>
  <button onclick="go(2)">Continuer</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
  <div class="box">
    <p>Tu veux un indice pour ton cadeau ? 👀</p>
    <button onclick="showHint()">Oui</button>
    <button onclick="showHint()">Non</button>
    <p id="hint" style="display:none; margin-top:15px;">
      L’indice est simple… ce n’est pas un objet 🎁
    </p>
  </div>
  <button onclick="go(3)">Continuer</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
  <div class="box">
    <p>Tu veux me voir ? 😊</p>

    <select id="date">
      <option>Choisis une date</option>
      <option>Demain</option>
      <option>Ce week-end</option>
      <option>La semaine prochaine</option>
    </select>

    <br>
    <button onclick="go(4)">Confirmer</button>
  </div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
  <h1>💙 Réservation confirmée 💙</h1>
  <p>Je te recontacte très vite…</p>
  <button onclick="go(5)">Message final</button>
</div>

<!-- PAGE 5 -->
<div class="page" id="page5">
  <div class="box">
    <h2>💌</h2>
    <p id="finalText">
      (Tu écriras ton message ici)
    </p>
  </div>
</div>

<script>
function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page' + page).classList.add('active');
}

function showHint() {
  document.getElementById('hint').style.display = 'block';
}
</script>

</body>
</html>
